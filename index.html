<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="fem-ui" content="2026-11-07b">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a4df0">
<title>sissy-test · 雌堕倾向程度量表</title>
<style>
:root{
  --bg:#f5f4f9; --card:#ffffff; --text:#1b1826; --muted:#6f6a80;
  --line:#e7e4f0; --brand:#7a4df0; --brand2:#e34d9b;
  --radius:14px;
  --shadow:0 1px 2px rgba(27,24,38,.04), 0 8px 24px rgba(27,24,38,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button, a, label, input, select, textarea{touch-action:manipulation}
/* 半透明水印层，--wm 由脚本注入 */
body::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:var(--wm, none);
  background-repeat:repeat;
  opacity:.078;
}
button{font-family:inherit}

/* 顶栏 */
.top{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:12px 18px; background:rgba(245,244,249,.9); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{
  font-weight:700; font-size:15px; letter-spacing:.2px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* 布局 */
#view{max-width:720px; margin:0 auto; padding:20px max(16px, env(safe-area-inset-left)) 130px max(16px, env(safe-area-inset-right)); position:relative; z-index:1}
.intro{padding:14px 2px 6px}
.intro h1{font-size:24px; margin:0 0 6px; letter-spacing:-.3px}
.lead{color:var(--muted); margin:0 0 4px; font-size:14px}
.byline{margin:0 0 12px; font-size:12.5px; color:#8a8499; letter-spacing:.2px}
.notice{
  font-size:12px; color:#8a8499; background:#fff; border:1px dashed var(--line);
  border-radius:10px; padding:10px 12px; margin:0; line-height:1.6;
}

/* 题目 */
.group{margin:26px 0 0}
.group h2{
  font-size:13px; font-weight:600; color:var(--brand); letter-spacing:.4px;
  margin:0 0 10px; padding-left:2px;
}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:10px; box-shadow:var(--shadow); transition:border-color .2s, box-shadow .2s;
}
.q.missing{border-color:#e0635f; box-shadow:0 0 0 3px rgba(224,99,95,.12)}
.q-head{display:flex; gap:10px; align-items:flex-start}
.q-no{
  flex:none; width:22px; height:22px; border-radius:7px; background:#f0edfa; color:var(--brand);
  font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:1px;
}
.q-text{margin:0; font-size:15px; line-height:1.55; font-weight:500}

.q-opts{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:12px}
.opt{position:relative; display:block}
.opt input{position:absolute; opacity:0; width:0; height:0}
.opt span{
  display:flex; align-items:center; justify-content:center; text-align:center;
  min-height:48px; padding:6px 3px; border:1px solid var(--line); border-radius:10px;
  font-size:12px; line-height:1.25; color:var(--muted); background:#fff; cursor:pointer;
  transition:all .15s ease; user-select:none; -webkit-tap-highlight-color:transparent;
}
.opt span:hover{border-color:#c9bff0; color:var(--brand)}
.opt input:checked + span{
  background:linear-gradient(135deg,var(--brand),var(--brand2)); border-color:transparent;
  color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(122,77,240,.25);
}

/* 五个选项按程度给不同的强调色：从冷灰蓝 -> 粉紫，越靠后越重 */
.opt:nth-child(1) input:checked + span{
  background:linear-gradient(135deg,#93a0b5,#76839a);
  box-shadow:0 4px 12px rgba(118,131,154,.25);
}
.opt:nth-child(2) input:checked + span{
  background:linear-gradient(135deg,#7fb0d0,#5c8db5);
  box-shadow:0 4px 12px rgba(92,141,181,.28);
}
.opt:nth-child(3) input:checked + span{
  background:linear-gradient(135deg,#a49bd0,#837aae);
  box-shadow:0 4px 12px rgba(131,122,174,.28);
}
.opt:nth-child(4) input:checked + span{
  background:linear-gradient(135deg,#b97bdb,#9a55c0);
  box-shadow:0 4px 12px rgba(154,85,192,.3);
}
.opt:nth-child(5) input:checked + span{
  background:linear-gradient(135deg,#7a4df0,#e34d9b);
  box-shadow:0 5px 16px rgba(227,77,155,.35);
}
.opt input:focus-visible + span{box-shadow:0 0 0 3px rgba(122,77,240,.25)}

/* 提交栏 */
.submitbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:rgba(255,255,255,.95); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
}
.submitbar .inner{max-width:688px; margin:0 auto; display:flex; align-items:center; gap:14px}
.prog{flex:1; min-width:0}
.prog-txt{font-size:12px; color:var(--muted); margin-bottom:5px}
.prog-txt b{color:var(--brand)}
.bar{height:6px; background:#ece9f5; border-radius:99px; overflow:hidden}
.bar i{
  display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .25s ease;
}
button.primary{
  background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border:0;
  border-radius:12px; padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer;
  box-shadow:0 6px 18px rgba(122,77,240,.28); white-space:nowrap;
}
button.primary:active{transform:translateY(1px)}
button.ghost{
  background:#fff; border:1px solid var(--line); color:var(--text); border-radius:12px;
  padding:11px 18px; font-size:14px; cursor:pointer;
}
button.ghost:hover{border-color:#c9bff0; color:var(--brand)}

/* 结果 */
.score-card{
  display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:22px; box-shadow:var(--shadow);
}
.ring{position:relative; width:132px; height:132px; flex:none; margin:0 auto}
.ring svg{width:100%; height:100%; display:block}
.ring-center{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.ring-center b{font-size:34px; line-height:1; letter-spacing:-1px}
.ring-center small{display:block; font-size:11px; color:var(--muted); margin-top:5px}
.score-meta{flex:1; min-width:200px}
.band{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px}
.score-meta h2{font-size:18px; margin:9px 0 6px}
.score-meta p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.65}
.score-tags{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.profile-name{font-size:15px; font-weight:700; color:var(--text); letter-spacing:-.2px}
.profile-body p{margin:0 0 10px; font-size:13.5px; line-height:1.8; color:#4a4556}
.profile-body p:last-child{margin-bottom:0}
.profile-body b{
  display:inline-block; font-size:11px; color:#8a8499; background:#f5f3fa;
  border-radius:6px; padding:1px 7px; margin-right:7px; font-weight:600; vertical-align:1px;
}
.sec-title{font-size:15px; margin:26px 0 10px; font-weight:600}

/* 雷达图 */
.radar-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 12px 4px; box-shadow:var(--shadow);
}
.radar-head{
  display:flex; justify-content:space-between; align-items:center;
  font-size:12.5px; color:var(--muted); padding:0 4px;
}
.radar-legend{display:flex; align-items:center; gap:6px; white-space:nowrap}
.radar-legend i{width:18px; height:0; border-top:2px dashed #b9a8e8; display:inline-block}
.radar{width:100%; height:auto; display:block; max-width:380px; margin:6px auto 0}
.radar-note{margin:2px 4px 10px; font-size:11.5px; color:#9a94a8; line-height:1.5; text-align:center}

/* 结果页头部 */
.result-head{
  flex-basis:100%; width:100%; display:flex; align-items:baseline;
  justify-content:space-between; gap:12px; flex-wrap:wrap;
  margin:-2px 0 6px; padding-bottom:10px; border-bottom:1px dashed var(--line);
}
.result-title{
  margin:0; font-size:30px; letter-spacing:-.8px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.by-mark{
  display:inline-block; font-size:16px; font-weight:800; letter-spacing:.4px;
  background:linear-gradient(90deg,#5b2fd6 0%,#e0157f 55%,#c2185b 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  white-space:nowrap;
}
.radar-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
/* 各维度得分 */
.dim{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px}
.dim-top{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:600; margin-bottom:8px}
.dim-top b{font-size:13px; color:var(--brand)}
.dim-bar{height:7px; background:#f1eef8; border-radius:99px; overflow:hidden}
.dim-bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--brand),var(--brand2))}
.dim-note{margin:8px 0 0; font-size:12.5px; color:var(--muted); line-height:1.6}
.disclaimer{
  font-size:12px; color:#8a8499; background:#fff; border:1px dashed var(--line);
  border-radius:10px; padding:11px 13px; margin:18px 0 0; line-height:1.6;
}
.result-actions{display:flex; gap:10px; margin-top:18px}
.result-actions button{flex:1}

/* toast */
.toast{
  position:fixed; left:50%; bottom:100px; transform:translate(-50%,10px); z-index:200;
  background:#241f33; color:#fff; font-size:13px; padding:10px 16px; border-radius:10px;
  opacity:0; pointer-events:none; transition:.25s ease; max-width:calc(100vw - 40px); text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:560px){
  .intro h1{font-size:21px}
  .q{padding:12px}
  .q-text{font-size:14.5px}
  .q-opts{gap:5px; margin-top:10px}
  .opt span{font-size:11px; min-height:46px; padding:5px 2px; border-radius:9px}
  .score-card{padding:18px; gap:14px}
  .ring{width:116px; height:116px}
  .submitbar .inner{gap:10px}
  button.primary{padding:11px 16px; font-size:14px}
  .result-title{font-size:24px; letter-spacing:-.4px}
  .result-head{gap:6px; padding-bottom:8px}
  .by-mark{font-size:14px}
  .radar-head{flex-wrap:wrap; row-gap:6px}
  .radar-right{width:100%; justify-content:space-between}
}

/* 小屏：五个选项压进一行 */
@media (max-width:400px){
  .q{padding:11px}
  .q-opts{gap:4px}
  .opt span{font-size:10px; padding:5px 1px; letter-spacing:-.2px; min-height:44px}
  .intro h1{font-size:20px}
  .lead{font-size:13px}
  .submitbar{padding-left:12px; padding-right:12px}
  .submitbar .inner{gap:8px}
  button.primary{padding:11px 14px; font-size:13.5px}
  .prog-txt{font-size:11px}
  .by-mark{font-size:13px; letter-spacing:.2px}
}
</style>
</head>

    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

var toastTimer = 0;
function toast(msg){
  var el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

var TEXT_ENC = new TextEncoder();
var TEXT_DEC = new TextDecoder();

function b64ToBytes(b64){
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function hexToBytes(hex){
  var out = new Uint8Array(hex.length / 2);
  for(var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

/* 从打散并异或过的分片里还原内容密钥 */
function contentKey(){
  var hex = "";
  for(var i = 0; i < VAULT.keyOrder.length; i++) hex += VAULT.keyFragments[VAULT.keyOrder[i]];
  var bytes = hexToBytes(hex);
  for(var j = 0; j < bytes.length; j++) bytes[j] ^= VAULT.keyMask;
  return bytes;
}

async function decryptBlob(b64){
  var raw = b64ToBytes(b64);
  var iv = raw.slice(0, 12);
  var ct = raw.slice(12);
  var key = await crypto.subtle.importKey("raw", contentKey(), "AES-GCM", false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv: iv}, key, ct);
  return JSON.parse(TEXT_DEC.decode(plain));
}

var config = null;

function normalize(o){
  return {
    dimensions: o.dimensions.map(function(d){
      return { id: String(d.id), name: String(d.name), desc: d.desc ? String(d.desc) : "" };
    }),
    questions: o.questions.map(function(q){
      var w = Number(q.weight);
      return {
        id: String(q.id), dim: String(q.dim), text: String(q.text),
        reverse: !!q.reverse,
        weight: (w >= 1 && w <= 5) ? Math.round(w) : 1
      };
    }),
    /* 画像文案等附加数据原样保留，否则保存一次就会被抹掉 */
    verdicts: (o.verdicts && typeof o.verdicts === "object") ? o.verdicts : {},
    highOne: (o.highOne && typeof o.highOne === "object") ? o.highOne : {},
    highTwo: (o.highTwo && typeof o.highTwo === "object") ? o.highTwo : {},
    special: (function(){
      var sp = (o.special && typeof o.special === "object") ? o.special : {};
      if(!sp.onlyLowExpression) sp.onlyLowExpression = { label: "只有表达低", text: "" };
      if(!sp.onlyLowMale) sp.onlyLowMale = { label: "只有绿奴低", text: "" };
      return sp;
    })()
  };
}

function validConfig(o){
  if(!o || !Array.isArray(o.dimensions) || !Array.isArray(o.questions)) return false;
  if(!o.dimensions.length || !o.questions.length) return false;
  var ids = {};
  o.dimensions.forEach(function(d){ if(d && d.id) ids[d.id] = true; });
  return o.questions.every(function(q){
    return q && typeof q.text === "string" && ids[q.dim];
  });
}

/* =========================================================
   评语分类（只看突出方向）
   <= 60            继续努力
   一项突出          6 种
   两项突出          15 种
   没有突出          按总分：大有潜力 / 接近完美 / 雌堕圣体
   突出 = 并列最高项比其余项的最高分高出 10 分以上
   并列超过两项时按平均处理
   ========================================================= */
function comboKey(a, b){
  return a < b ? (a + "+" + b) : (b + "+" + a);
}

/* 3-4 项并列突出时的收敛顺序 */
var DIM_PRIORITY = { role: 4, fantasy: 3, figure: 2, expression: 1 };
var SPECIAL_DIMS = { deprave: true, male: true };

function byPriority(a, b){
  return (DIM_PRIORITY[b.id] || 0) - (DIM_PRIORITY[a.id] || 0);
}

function comboOf(list){
  if(!list.length) return null;
  if(list.length === 1) return (config.highOne || {})[list[0].id] || null;
  var key = comboKey(list[0].id, list[1].id);
  return (config.highTwo || {})[key] || null;
}

/* 共堕 / 绿奴先顶上来，剩下的名额按 服从 > 性幻想 > 外形 > 表达 补 */
function reduceTops(tops){
  var specials = tops.filter(function(d){ return SPECIAL_DIMS[d.id]; });
  var others = tops.filter(function(d){ return !SPECIAL_DIMS[d.id]; }).sort(byPriority);
  if(specials.length >= 2) return [specials[0], specials[1]];
  if(specials.length === 1) return others.length ? [specials[0], others[0]] : [specials[0]];
  return others.slice(0, 2);
}

/* 突出项：按分数降序，找到最后一个「断档 ≥ 8」的位置，
   该位置之前的模块整体比其余模块高出 8 分以上，全部算突出。
   组内不必并列：100 / 96 / 75 / 75 / 75 / 75 → 100 和 96 都突出。 */
function findHighs(per){
  var sorted = per.slice().sort(function(a, b){ return b.pct - a.pct; });
  var cut = 0;
  for(var i = 1; i < sorted.length; i++){
    if(sorted[i - 1].pct - sorted[i].pct >= 8) cut = i;
  }
  return cut > 0 ? sorted.slice(0, cut) : [];
}

function classifyVerdict(per, score){
  var V = config.verdicts || {};
  if(!per.length) return null;
  if(score <= 50) return V.keep_going || null;

  var highs = findHighs(per);
  if(highs.length === 1) return comboOf(highs);
  if(highs.length === 2) return comboOf(highs);

  /* 5 项突出、只剩一项偏低：表达 / 绿奴 各有一条专属画像 */
  if(highs.length === 5){
    var lowOne = per.filter(function(d){ return highs.indexOf(d) < 0; })[0];
    var S = config.special || {};
    if(lowOne && lowOne.id === "expression" && S.onlyLowExpression) return S.onlyLowExpression;
    if(lowOne && lowOne.id === "male" && S.onlyLowMale) return S.onlyLowMale;
    return comboOf(reduceTops(highs));
  }
  if(highs.length >= 3) return comboOf(reduceTops(highs));

  var full = per.filter(function(d){ return d.pct >= 99.5; });
  if(full.length >= 1 && full.length <= 2 &&
     full.some(function(d){ return SPECIAL_DIMS[d.id]; })){
    return comboOf(full);
  }

  if(score >= 99.5 && V.perfect) return V.perfect;
  if(score >= 94 && V.near_perfect) return V.near_perfect;
  return V.potential || null;
}

var SHORT_NAME = {

function shortName(d){

  var n = String(d.name || "").replace(/[与和的]/g, "");
  return n.length > 5 ? n.slice(0, 5) : n;
}

function radarSVG(items, score){
  var n = items.length;
  if(!n) return "";
  var W = 360, H = 360;
  var cx = W / 2, cy = H / 2;
  var R = 112;
  var start = -Math.PI / 2;
  var step = Math.PI * 2 / n;

  function pt(i, r){
    var a = start + step * i;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  }
  function pts(arr){
    return arr.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  }

  var grid = "";
  [0.25, 0.5, 0.75, 1].forEach(function(k){
    var ring = [];
    for(var i = 0; i < n; i++) ring.push(pt(i, R * k));
    grid += '<polygon points="' + pts(ring) + '" fill="none" stroke="#e9e6f2" stroke-width="1"/>';
  });
  for(var i = 0; i < n; i++){
    var e = pt(i, R);
    grid += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' +
      e[1].toFixed(1) + '" stroke="#eeebf6" stroke-width="1"/>';
  }

  var data = items.map(function(d, i){
    var v = Math.max(0.03, Math.min(1, d.pct / 100));
    return pt(i, R * v);
  });

  var dots = data.map(function(p){
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
      '" r="3" fill="#fff" stroke="#7a4df0" stroke-width="1.6"/>';
  }).join("");

  var labels = items.map(function(d, i){
    var p = pt(i, R + 20);
    var a = start + step * i;
    var cos = Math.cos(a), sin = Math.sin(a);
    var anchor = Math.abs(cos) < 0.25 ? "middle" : (cos > 0 ? "start" : "end");
    var dy = sin > 0.55 ? 11 : (sin < -0.55 ? -3 : 4);
    return '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy).toFixed(1) +
      '" text-anchor="' + anchor + '" font-size="10.5" fill="#6f6a80">' +
      esc(shortName(d)) + '</text>';
  }).join("");

  var compR = R * Math.max(0, Math.min(1, score / 100));

  return '<svg class="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="偏好雷达图">' +
    '<defs>' +
      '<linearGradient id="radarFill" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#7a4df0" stop-opacity=".36"/>' +
        '<stop offset="100%" stop-color="#e34d9b" stop-opacity=".2"/>' +
      '</linearGradient>' +
      '<linearGradient id="radarStroke" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#7a4df0"/><stop offset="100%" stop-color="#e34d9b"/>' +
      '</linearGradient>' +
    '</defs>' +
    grid +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + compR.toFixed(1) +
      '" fill="none" stroke="#b9a8e8" stroke-width="1.4" stroke-dasharray="5 4"/>' +
    '<polygon points="' + pts(data) + '" fill="url(#radarFill)" stroke="url(#radarStroke)" ' +
      'stroke-width="2" stroke-linejoin="round"/>' +
    dots +
    labels +
  '</svg>';
}

var ORDER_KEY = "fem_quiz_order";

/* 随机打乱一次，顺序存在 sessionStorage，刷新不会变 */
function orderedQuestions(){
  var map = {};
  config.questions.forEach(function(q){ map[q.id] = q; });

  var saved = null;
  try{ saved = JSON.parse(sessionStorage.getItem(ORDER_KEY) || "null"); }catch(e){ saved = null; }

  if(saved && saved.length === config.questions.length &&
     saved.every(function(id){ return !!map[id]; })){
    return saved.map(function(id){ return map[id]; });
  }

  var arr = config.questions.slice();
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  try{
    sessionStorage.setItem(ORDER_KEY, JSON.stringify(arr.map(function(q){ return q.id; })));
  }catch(e){ /* 忽略 */ }
  return arr;
}

function renderQuiz(){
  var qs = orderedQuestions();
  var total = qs.length;
  var done = countAnswered();
  var pct = total ? Math.round(done / total * 100) : 0;

  var body = qs.map(function(q, i){ return qCard(q, i + 1); }).join("");

  view.innerHTML =

function onAnswer(e){
  var t = e.target;
  if(t && t.type === "radio" && t.name){
    answers[t.name] = Number(t.value);
    saveDraft();
    var total = config.questions.length;
    var done = countAnswered();
    var cnt = $("#p-count");
    var bar = $("#p-bar");
    if(cnt) cnt.textContent = done;
    if(bar) bar.style.width = (total ? done / total * 100 : 0) + "%";
  }
}

function onSubmit(){
  var missing = config.questions.filter(function(q){ return !answers[q.id]; });
  if(missing.length){
    var el = null;
    Array.prototype.some.call(view.querySelectorAll(".q"), function(node){
      if(node.getAttribute("data-qid") === missing[0].id){ el = node; return true; }
      return false;
    });
    if(el){
      el.classList.add("missing");
      el.scrollIntoView({behavior:"smooth", block:"center"});
      setTimeout(function(){ el.classList.remove("missing"); }, 1800);
    }
    toast("还有 " + missing.length + " 题没有作答");
    return;
  }
  renderResult();
}

          '<span class="radar-legend"><i></i>综合分 ' + score.toFixed(0) + '</span>' +
        '</span>' +
      '</div>' +
      radarSVG(per, score) +
      '<p class="radar-note">虚线为综合分水平 · 各维度等权，综合分为 ' + config.dimensions.length +
        ' 个维度的平均分</p>' +
    '</div>' +

    '<h3 class="sec-title">各维度得分</h3>' +
    per.map(function(d){
      var v = Math.round(d.pct);
      return '<div class="dim">' +
        '<div class="dim-top"><span>' + esc(d.name) + '</span><b>' + v + '</b></div>' +
        '<div class="dim-bar"><i style="width:' + v + '%"></i></div>' +
        '<p class="dim-note">' + esc(dimNote(d.id, v)) + '</p>' +
      '</div>';
    }).join("") +

    '<p class="disclaimer">分数只反映你此刻在这份问卷上的自我报告，会随状态和情境变化。它不用于诊断任何心理或医学状况；' +
    '如果这些感受让你困扰，和信任的人或专业人士聊聊会比一份问卷更有帮助。</p>' +

    '<div class="result-actions">' +
      '<button type="button" class="ghost" id="btn-back">返回修改</button>' +
      '<button type="button" class="ghost" id="btn-again">重新测试</button>' +
    '</div>';

  resetScroll();

  $("#btn-back").addEventListener("click", function(){
    renderQuiz();
    resetScroll();
  });
  $("#btn-again").addEventListener("click", function(){
    answers = {};
    clearDraft();
    try{ sessionStorage.removeItem(ORDER_KEY); }catch(e){ /* 忽略 */ }
    renderQuiz();
    resetScroll();
  });
}

/* =========================================================
   启动
   ========================================================= */
function renderFatal(err){
  view.innerHTML =
    '<section class="intro"><h1>题库无法加载</h1>' +
    '<p class="notice">' + esc(err && err.message ? err.message : String(err)) +
    '<br>文件可能被修改或损坏，请重新获取原始文件。</p></section>';
}

/* 背景水印：用 SVG 平铺，中文经 encodeURIComponent 编码 */
(function(){
  var text = "發爻｜雌堕训练师 @dommietutor";
  var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='560'>" +
    "<text x='40' y='320' fill='#7a4df0' font-family='sans-serif' font-size='40' " +
    "transform='rotate(-24 500 280)'>" + text + "</text></svg>";
  try{
    document.body.style.setProperty("--wm", 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")');
  }catch(e){ /* 忽略 */ }
})();

function renderEnvError(){
  var insecure = location.protocol === "http:" &&
    location.hostname !== "localhost" &&
    location.hostname !== "127.0.0.1";
  view.innerHTML =
    '<section class="intro">' +
      '<h1>这个环境打不开</h1>' +
      '<p class="notice">' +
        '页面用到了浏览器加密接口，它只在下面几种情况下工作：<br>' +
        '· 直接打开本地的 HTML 文件<br>' +
        '· https:// 开头的网址<br>' +
        '· localhost 或 127.0.0.1<br><br>' +
        (insecure ? '你现在是通过局域网 http:// 打开的，浏览器会禁用加密接口。<br><br>' : '') +
        '当前地址：' + esc(location.href) +
      '</p>' +
    '</section>';
}

async function boot(){
  if("scrollRestoration" in history){
    try{ history.scrollRestoration = "manual"; }catch(e){ /* 忽略 */ }
  }
  if(!window.crypto || !window.crypto.subtle){
    renderEnvError();
    return;
  }
  try{
    var data = await decryptBlob(VAULT.blob);
    if(!validConfig(data)) throw new Error("题库结构不正确");
    config = normalize(data);
    loadDraft();
    renderQuiz();
  }catch(err){
    renderFatal(err);
  }
}

boot();

})();
</script>
